server {
    listen 443 ssl;
    server_name regappa01.nx.inprod.ept.lu regappa01;

    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Proxy API → backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Without this, nginx applies its 1 MB default and rejects the upload
        # with a 413 before FastAPI ever sees it. The RCP reattribution tool
        # posts a whole set of return/reject extracts in one multipart request
        # (13 MB on 2026-08-13, and the dumps only grow); the backend enforces
        # its own cap (MAX_TOTAL_UPLOAD_BYTES) once the body gets through.
        client_max_body_size 64m;
    }

    # Proxy Frontend → Vite dev server
    location / {
        proxy_pass http://frontend:5173/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Vite HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
