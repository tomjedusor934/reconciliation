
services:
  db:
    image: postgres:16-alpine
    container_name: reconciliation-db
    volumes:
      - reco_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    networks:
      - orchestro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reconciliation-backend
    volumes:
      - ./backend:/app
      - /POST_HOME/dataStaging/in:/data/staging/in
      - /POST_HOME/dataStaging/out/reconciliation:/data/staging/out/reconciliation
      - /POST_HOME/dataStaging/out/reconciliation_errors:/data/staging/out/reconciliation_errors
      - ./shared/inbox:/shared/inbox
      - ./shared/inbox_processed:/shared/inbox_processed
      - ./shared/inbox_error:/shared/inbox_error
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orchestro-network
      # - app-proxy-network
      - airflow-network
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - INBOX_BASE_PATH=${INBOX_BASE_PATH:-/shared/inbox}
      - INBOX_PROCESSED_PATH=${INBOX_PROCESSED_PATH:-/shared/inbox_processed}
      - INBOX_ERROR_PATH=${INBOX_ERROR_PATH:-/shared/inbox_error}
      - INBOX_STAGING_MODE=${INBOX_STAGING_MODE:-true}
      - AIRFLOW_API_URL=${AIRFLOW_API_URL:-http://airflow-airflow-apiserver-1:8080/api/v1}
      - AIRFLOW_API_USER=${AIRFLOW_API_USER:-airflow}
      - AIRFLOW_API_PASSWORD=${AIRFLOW_API_PASSWORD:-airflow}
      - AIRFLOW_USE_EXTERNAL=${AIRFLOW_USE_EXTERNAL:-true}
      - RECO_BACKEND_INTERNAL_TOKEN=${RECO_BACKEND_INTERNAL_TOKEN:-change-me-internal-token}
      - RECO_ARCHIVE_AFTER_DAYS=${RECO_ARCHIVE_AFTER_DAYS:-90}
      - SSO_ENCRYPTION_KEY=${SSO_ENCRYPTION_KEY}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:-admin@reveals.lu}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-admin}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    container_name: reconciliation-redis
    expose:
      - "6379"
    networks:
      - orchestro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reconciliation-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    # expose:
    #   - "9008"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_ALLOWED_HOST=${VITE_ALLOWED_HOST}
      - VITE_PROXY_TARGET=${VITE_PROXY_TARGET}
    depends_on:
      - backend
    networks:
      - orchestro-network
      # - app-proxy-network

  adminer:
    image: adminer:latest
    container_name: reconciliation-adminer
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - orchestro-network

  nginx:
    image: nginx:alpine
    container_name: reconciliation-nginx
    ports:
      - "${NGINX_PORT:-9443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /POST_HOME/programs/tools/airflow/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - adminer
    networks:
      - orchestro-network


networks:
  orchestro-network:
    driver: bridge
  airflow-network:
    external: true
    name: airflow_default

volumes:
  reco_postgres_data:
  reco_airflow_db_data:
