x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://reco_airflow:${AIRFLOW_DB_PASSWORD:-54Zfy7BUC_gFWE186UH8oCZkggc_ixjg}@airflow-db:5432/reco_airflow_db
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://reco_airflow:${AIRFLOW_DB_PASSWORD:-54Zfy7BUC_gFWE186UH8oCZkggc_ixjg}@airflow-db:5432/reco_airflow_db
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/1
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET:-airflow-secret-change-me}
    RECO_BACKEND_URL: http://backend:8000
    RECO_BACKEND_INTERNAL_TOKEN: ${RECO_BACKEND_INTERNAL_TOKEN:-change-me-internal-token}
  volumes:
    - ./shared/dags:/opt/airflow/dags
    - ./shared/airflow_logs:/opt/airflow/logs
    - ./shared/airflow_plugins:/opt/airflow/plugins
    - ./shared/inbox:/opt/airflow/inbox
    - ./shared/inbox_processed:/opt/airflow/inbox_processed
    - ./shared/inbox_error:/opt/airflow/inbox_error
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - orchestro-network

services:
  db:
    image: postgres:16-alpine
    container_name: reconciliation-db
    volumes:
      - reco_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    networks:
      - orchestro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reconciliation-backend
    volumes:
      - ./backend:/app
      - /POST_HOME/dataStaging/in:/data/staging/in
      - /POST_HOME/dataStaging/out/reconciliation:/data/staging/out/reconciliation
      - /POST_HOME/dataStaging/out/reconciliation_errors:/data/staging/out/reconciliation_errors
      - ./shared/inbox:/shared/inbox
      - ./shared/inbox_processed:/shared/inbox_processed
      - ./shared/inbox_error:/shared/inbox_error
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orchestro-network
      # - app-proxy-network
      - airflow-network
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - INBOX_BASE_PATH=${INBOX_BASE_PATH:-/shared/inbox}
      - INBOX_PROCESSED_PATH=${INBOX_PROCESSED_PATH:-/shared/inbox_processed}
      - INBOX_ERROR_PATH=${INBOX_ERROR_PATH:-/shared/inbox_error}
      - INBOX_STAGING_MODE=${INBOX_STAGING_MODE:-true}
      - AIRFLOW_API_URL=${AIRFLOW_API_URL:-http://airflow-airflow-apiserver-1:8080/api/v1}
      - AIRFLOW_API_USER=${AIRFLOW_API_USER:-airflow}
      - AIRFLOW_API_PASSWORD=${AIRFLOW_API_PASSWORD:-airflow}
      - AIRFLOW_USE_EXTERNAL=${AIRFLOW_USE_EXTERNAL:-true}
      - RECO_BACKEND_INTERNAL_TOKEN=${RECO_BACKEND_INTERNAL_TOKEN:-change-me-internal-token}
      - RECO_ARCHIVE_AFTER_DAYS=${RECO_ARCHIVE_AFTER_DAYS:-90}
      - SSO_ENCRYPTION_KEY=${SSO_ENCRYPTION_KEY}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    container_name: reconciliation-redis
    expose:
      - "6379"
    networks:
      - orchestro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reconciliation-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    # expose:
    #   - "9008"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_ALLOWED_HOST=${VITE_ALLOWED_HOST}
      - VITE_PROXY_TARGET=${VITE_PROXY_TARGET}
    depends_on:
      - backend
    networks:
      - orchestro-network
      # - app-proxy-network

  # proxy:
  #   image: haproxy:2.8-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "9008:9009"
  #   volumes:
  #     - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #     - db

  nginx:
    image: nginx:alpine
    container_name: reconciliation-nginx
    ports:
      - "${NGINX_PORT:-9443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - orchestro-network

  airflow-db:
    image: postgres:16-alpine
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: reco_airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-54Zfy7BUC_gFWE186UH8oCZkggc_ixjg}
      POSTGRES_DB: reco_airflow_db
    volumes:
      - reco_airflow_db_data:/var/lib/postgresql/data
    networks:
      - orchestro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reco_airflow -d reco_airflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    profiles: ["airflow"]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_API_USER:-airflow}" \
          --password "${AIRFLOW_API_PASSWORD:-airflow}" \
          --firstname Air --lastname Flow \
          --role Admin --email airflow@local || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    profiles: ["airflow"]
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    profiles: ["airflow"]
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    profiles: ["airflow"]
    command: celery worker
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

networks:
  orchestro-network:
    driver: bridge
  airflow-network:
    external: true
    name: airflow_default

volumes:
  reco_postgres_data:
  reco_airflow_db_data:
