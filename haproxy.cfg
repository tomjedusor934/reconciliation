global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

# Port 9009 est partagé entre l'API HTTP et PostgreSQL.
# HAProxy inspecte les premiers octets pour distinguer les deux protocoles :
#   - Startup PostgreSQL  : octets [4:8] = 0x00030000 (version 3.0)
#   - SSL PostgreSQL       : octets [4:8] = 0x04D2162F (code de négociation SSL)
#   - Tout le reste        : considéré comme HTTP → API FastAPI
frontend mixed_frontend
    bind *:9009
    mode tcp
    tcp-request inspect-delay 3s
    tcp-request content accept if { req.payload(0,8) -m found }

    acl is_postgres     req.payload(4,4) -m bin "00030000"
    acl is_postgres_ssl req.payload(4,4) -m bin "04d2162f"

    use_backend postgres_backend if is_postgres
    use_backend postgres_backend if is_postgres_ssl
    default_backend api_backend

# Trafic HTTP → FastAPI
backend api_backend
    mode tcp
    server api api:9008

# Connexions DBeaver / psql → PostgreSQL
backend postgres_backend
    mode tcp
    server db db:5435
